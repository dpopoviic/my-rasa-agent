# This file contains the different endpoints your bot can use.

# Server which runs your custom actions.
# https://rasa.com/docs/rasa-pro/concepts/custom-actions
# actions_module znaci da se akcije izvrsavaju u istom procesu kao Rasa (nema posebnog action servera).

action_endpoint:
  actions_module: "actions"

# Allow rephrasing of responses using a Rasa-hosted model
nlg:
  type: rephrase
  # Rasin podrazumevani prompt + pravilo da odgovor bude na jeziku razgovora ({{language}})
  # rephrase_all: svaki odgovor prolazi kroz LLM i prevodi se na jezik iz slota `language`
  # (odgovor sa `rephrase: false` u metadata ide doslovno, bez prevoda)
  rephrase_all: true
  prompt_template: prompts/rephraser_prompt.jinja2
  llm:
    model_group: azure_llm_deployments
  summarize_history: false
  max_historical_turns: 10

# Baza znanja za EnterpriseSearchPolicy: Azure AI Search indeks (implementacija: azure_search_store.py),
# iza filtera po ulogama (role_filtered_store.py) - korisnik dobija samo dokumente koje njegove
# uloge smeju da citaju, po pravilima iz knowledge_access.yml.
vector_store:
  type: role_filtered_store.RoleFilteredStore        # mora biti isto kao vector_store.type u config.yml
  inner_type: azure_search_store.AzureAISearch_Store # pravi store; za drugi store menja se ovo + njegova podesavanja ispod
  access_rules: knowledge_access.yml                 # ko sme sta da cita (menja se bez restarta Rase)
  max_results: 4                                     # koliko delova dokumenata najvise ide LLM-u, posle filtriranja
  # --- sve ispod ide pravom store-u (azure_search_store.py) ---
  endpoint: ${AZURE_SEARCH_ENDPOINT}        # npr. https://<naziv-search-resursa>.search.windows.net
  index_name: ${AZURE_SEARCH_INDEX}         # naziv indeksa
  api_key: ${AZURE_SEARCH_API_KEY}          # Query key (dovoljan je read-only) iz Azure portala
  content_field: chunk                      # polje sa tekstom (u tvom indeksu 'chunk' je popunjen, 'content' je prazan u svih 29 dokumenata)
  metadata_fields: [title]                  # title je OBAVEZAN - po njemu filter po ulogama prepoznaje dokument (match_field u knowledge_access.yml)
  semantic_configuration: rag-1790004221586-mss-stud-proj-semantic-configuration        # opciono: ime semantic konfiguracije iz indeksa
  vector_field: text_vector             # opciono: ukljucuje hibridnu pretragu (koristi azure_embeddings)
  top_k: 12                                 # vise od max_results: deo rezultata filter odbaci (tudji dokumenti)
  #vector_field i semantic_configuration obezbedjuju da se pretraga podataka vrsi semanticki a ne samo po kljucnoj reci.

# Kljucevi se citaju iz .env fajla (${NAZIV_PROMENLJIVE}), ne upisuju se ovde.
model_groups:
  # Tekstualni LLM: command generator, EnterpriseSearchPolicy i rephraser
  - id: azure_llm_deployments
    models:
      - provider: azure
        deployment: gpt-5-mini-2
        # samo host resursa, bez putanje - LiteLLM sam dodaje /openai/deployments/<deployment>/...
        api_base: https://dp-20220322-foundry.services.ai.azure.com/
        # Azure API verzija (NE verzija modela); 2025-08-07 je verzija modela gpt-5-mini
        api_version: "2025-04-01-preview"
        api_key: ${AZURE_API_KEY}
    router:
      routing_strategy: simple-shuffle

  # LLM za ReAct sub agenta event_assistant (sub_agents/event_assistant/config.yml).
  # Posebna grupa da bi agent mogao da dobije jaci model bez menjanja ostatka bota.
  - id: agent_llm
    models:
      - provider: azure
        deployment: gpt-5-mini-2
        api_base: https://dp-20220322-foundry.services.ai.azure.com/
        api_version: "2025-04-01-preview"
        api_key: ${AZURE_API_KEY}
        timeout: 60                           # sekundi po jednom LLM pozivu agenta

  # Embedding model: potreban EnterpriseSearchPolicy-ju za pretragu dokumenata.
  # TODO: upisi ime svog embedding deployment-a iz Azure-a i proveri api_base/api_version.
  - id: azure_embeddings
    models:
      - provider: azure
        deployment: text-embedding-3-small
        api_base: https://dp-20220322-foundry.services.ai.azure.com/
        api_version: "2024-02-01"
        api_key: ${AZURE_API_KEY}

# MCP server sa alatima za ReAct agenta (mcp_tools/server.py - mora biti pokrenut uz Rasu:
# python -m mcp_tools.server). Rasa salje MCP_API_KEY u X-Mcp-Api-Key zaglavlju;
# token korisnika ide posebno, u _meta svakog poziva (event_assistant_agent.py).
mcp_servers:
  - name: event_tools
    url: http://localhost:8765/mcp
    type: http
    # Auth kljucevi idu direktno ovde (Rasa ih sama skuplja u additional_params)
    api_key: ${MCP_API_KEY}
    header_name: X-Mcp-Api-Key
    header_format: "{key}"

# Istorija razgovora: SQLTrackerStore u LocalDB bazi RasaTracker (tabele events i users pravi Rasa)
tracker_store:
  type: SQL
  dialect: "mssql+pyodbc"
  url: '(localdb)\MSSQLLocalDB'   # isto ime servera kao u SSMS
  db: "RasaTracker"
  query:
    driver: "ODBC Driver 17 for SQL Server"
    Trusted_Connection: "yes"     # Windows login - ne trebaju username/password

# Trajna istorija: samo poruke korisnik/bot u tabelu ChatMessages (implementacija: chat_message_broker.py)
event_broker:
  type: chat_message_broker.ChatMessageBroker
  dialect: "mssql+pyodbc"
  url: '(localdb)\MSSQLLocalDB'
  db: "RasaTracker"
  query:
    driver: "ODBC Driver 17 for SQL Server"
    Trusted_Connection: "yes"
  # Ciscenje starih podataka (implementacija: history_cleanup.py)
  events_retention_hours: 24      # events: brisu se ranije sesije i razgovori bez aktivnosti duze od 24h (mora biti > session_expiration_time iz domain.yml)
  messages_retention_days: 90     # ChatMessages: brisu se poruke starije od 90 dana (null = nikad)
  cleanup_interval_minutes: 60    # koliko cesto se ciscenje pokrece (prvi put odmah pri startu Rase)

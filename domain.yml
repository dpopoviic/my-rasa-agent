version: "3.1"

actions:
  - action_search_events
  - action_resolve_event
  - action_get_event_availability
  - action_list_my_reservations
  - action_reserve_event
  - action_cancel_reservation
  - action_set_language

slots:
  # --- Filteri za pretragu događaja (opcioni, LLM ih popunjava iz poruke) ---
  # initial_value je bitan: collect korak se PRESKACE kad slot vec ima vrednost,
  # pa Rasa ne pita za filtere koje korisnik nije naveo. Prazan tekst / false = "bez filtera".
  search_term:
    type: text
    initial_value: ""
    mappings:
      - type: from_llm
  start_date:
    type: text
    initial_value: ""
    mappings:
      - type: from_llm
  end_date:
    type: text
    initial_value: ""
    mappings:
      - type: from_llm
  search_month:
    type: text
    initial_value: ""
    mappings:
      - type: from_llm
  search_year:
    type: text
    mappings:
      - type: from_llm
  location:
    type: text
    initial_value: ""
    mappings:
      - type: from_llm
  only_available:
    type: bool
    initial_value: false
    mappings:
      - type: from_llm

  # #primer sa validatorom, za proveru formata gresaka pri kucanju i slicno: 
  #  phone_number:
  #   type: text
  #   mappings:
  #     - type: from_llm
  #   validation:
  #     rejections:
  #       - if: not (slots.phone_number matches "^\([0-9]{3}\) [0-9]{3}-[0-9]{4}$")
  #         utter: utter_invalid_phone_number
  #     refill_utter: "utter_refill_phone_number"
  
  # --- Identifikatori nad kojima se izvršava akcija ---
  event_name:
    type: text
    mappings:
      - type: from_llm
  event_id:
    type: float
    mappings:
      - type: from_llm
  event_confirmed:
    type: bool
    mappings:
      - type: from_llm
  event_match:
    type: text
    mappings:
      - type: controlled
  last_listed_events:
    type: list
    mappings:
      - type: controlled

  reservation_id:
    type: float
    mappings:
      - type: from_llm
  cancel_confirmed:
    type: bool
    mappings:
      - type: from_llm
  notes:
    type: text
    mappings:
      - type: from_llm

  # --- Jezik koji je korisnik izricito trazio (flow change_language) ---
  # Ugradjeni slot `language` nema mappings, pa ga LLM ne moze postaviti; LLM puni
  # ovaj slot, a action_set_language iz njega postavlja `language`.
  requested_language:
    type: categorical
    values:
      - serbian_cyrillic
      - serbian_latin
      - english
    mappings:
      - type: from_llm

  # --- Rezultati akcija, popunjava ih iskljucivo Python akcija (SlotSet),
  #     nikad LLM - odgovori ih samo prikazuju korisniku. ---
  events_search_result:
    type: text
    mappings:
      - type: controlled
  event_availability_result:
    type: text
    mappings:
      - type: controlled
  my_reservations_result:
    type: text
    mappings:
      - type: controlled
  reservation_action_result:
    type: text
    mappings:
      - type: controlled

responses:
  utter_ask_search_term:
    - text: "Шта бисте желели да пронађете? Реците назив, тему, или 'сви догађаји' ако желите комплетну листу."
      # Moguce ej dodati transaltion: i u ovo redu jezik i prevod na tom jeziku
  utter_ask_start_date:
    - text: "Од ког датума да тражим догађаје? (нпр. 2026-10-01, или реците да вам није битно)"

  utter_ask_end_date:
    - text: "До ког датума да тражим догађаје?"
  
  utter_ask_search_year:
    - text: "Нисте навели годину. За коју годину да тражим догађаје?"

  utter_ask_location:
    - text: "Да ли тражите догађаје у одређеном месту?"

  utter_ask_only_available:
    - text: "Да прикажем само догађаје који још увек имају слободних места?"

  utter_ask_event_name:
    - text: "За који догађај? Унесите назив догађаја тачно онако како је написан у списку догађаја."

  utter_ask_event_confirmed:
    - text: "Да ли сте сигурни да желите резервацију за догађај {event_name}?"

  utter_ask_notes:
    - text: "Желите ли да додате напомену уз резервацију? Ако не, реците 'не'."

  utter_ask_reservation_id:
    - text: "Коју резервацију желите да откажете? Реците ID резервације или назив догађаја."

  utter_ask_cancel_confirmed:
    - text: "Да ли сте сигурни да желите да откажете резервацију са ID {reservation_id}? Отказивање не може да се поништи."

  utter_cancel_aborted:
    - text: "У реду, резервација није отказана."

  utter_search_events_result:
    - text: "{events_search_result}"

  utter_event_availability_result:
    - text: "{event_availability_result}"

  utter_my_reservations_result:
    - text: "{my_reservations_result}"

  utter_reservation_action_result:
    - text: "{reservation_action_result}"

  # Override za ugrađeni pattern_cannot_handle flow (grana "not_supported").
  utter_cannot_handle:
    - text: "Нажалост, тај захтев не могу да извршим. Могу да Вам помогнем око претраге догађаја, Ваших резервација или питања из моје базе знања."

  # Koristi ga EnterpriseSearchPolicy ([NO_RAG_ANSWER]): pitanje van domena ILI podatak koji ne postoji /
  # korisnik ne sme da vidi - namerno isti tekst za sve, da se ne otkrije da podatak postoji.
  utter_no_relevant_answer_found:
    - text: "Ја сам Влаки, асистент за догађаје, резервације и питања из моје базе знања, па о томе немам информацију. Радо ћу Вам помоћи око догађаја, Ваших резервација или неког питања из те области."

  # Override ugradjenih odgovora koji bi korisniku pokazali interne nazive slotova
  # (pattern_correction: "updating search_term to ...") ili ga ne razumeju.
  utter_corrected_previous_input:
    - text: "У реду, исправио сам податке које сте навели."

  utter_ask_rephrase:
    - text: "Извините, нисам Вас добро разумео. Можете ли да преформулишете?"

  # Override ugradjenog odgovora iz pattern_completed (original je engleski + rephrase,
  # pa je LLM birao pismo sam).
  utter_can_do_something_else:
    - text: "Да ли могу да Вам помогнем са још нечим?"

  # Override ugradjenog odgovora iz pattern_human_handoff (original je engleski).
  # Prebacivanje na zivog operatera jos ne postoji, pa samo obavestavamo korisnika.
  utter_human_handoff_not_available:
    - text: "Разумем да желите да разговарате са особом, али то тренутно није могуће. Могу да помогнем око претраге догађаја, доступности и резервација."

  # Flow change_language. Salje se posle action_set_language, pa ga rephraser vec
  # prevodi na novi jezik.
  utter_ask_requested_language:
    - text: "На ком језику желите да Вам одговарам: српски ћирилицом, српски латиницом или енглески?"

  utter_language_changed:
    - text: "У реду, од сада ћу Вам одговарати на овом језику. Како могу да Вам помогнем?"

  utter_free_chitchat_response:
    - text: "placeholder"
      metadata:
        rephrase: True
        # Zajednicko jezgro (vidi prompts/event_assistant_prompt.jinja2), skraceno za caskanje.
        rephrase_prompt: |
          {%- set language_labels = {"sr-Cyrl": "Serbian, written in Cyrillic script (ћирилица)", "sr-Latn": "Serbian, written in Latin script (latinica)", "en": "English"} -%}
          {%- set language_code = slots.get("language") if slots else none -%}
          {%- set answer_language = language_labels.get(language_code) or language -%}
          ### Who you are
          You are **Vlaki**, the virtual assistant of the event reservation application. You help signed-in users to:
          - browse available events and check how many places are free,
          - make, review and cancel their own reservations,
          - get answers to questions covered by your knowledge base.
          That is your whole scope.

          ### Your task
          The user is making small talk. Reply briefly and kindly: greet back, say who you are or what you can
          do (the three things above), or acknowledge the user's name. If the message asks about anything outside
          your scope (programming, general knowledge, other topics), decline politely: you are Vlaki, an assistant
          for events, reservations and questions from your knowledge base, you have no information about that,
          and you would be glad to help with events, reservations or a question from that area.

          ### Core rules
          1. Write the ENTIRE reply in {{ answer_language }}, whatever language or script the user writes in. Do not mix scripts.
          2. No invention: never mention any event, reservation or fact. Never answer from general knowledge.
          3. Never show technical names (slots, flows, tools, code) and never mention roles or permissions.
          4. Formal, polite and kind{% if language_code != "en" %}; in Serbian always "Vi" / "Vas" / "Vam", never "ti"{% endif %}. One to three sentences, no emojis.

          Context / previous conversation with the user:
          {{history}}

          Last user message:
          {{current_input}}

          Reply in {{ answer_language }}:

  # Poruke koje salje action_resolve_event. Moraju biti odgovori (ne tekst u kodu),
  # jer samo odgovori prolaze kroz rephraser, pa se samo oni prevode.
  utter_not_signed_in:
    - text: "Морате бити пријављени да бисте ово урадили."

  utter_generic_error:
    - text: "Дошло је до проблема приликом комуникације са апликацијом. Молимо покушајте поново касније."

  utter_event_name_not_found:
    - text: "Нисам пронашао догађај под називом „{term}“. Молим унесите тачан назив."

  utter_multiple_events_found:
    - text: "Пронашао сам више догађаја који садрже „{term}“:\n{names}"

session_config:
  session_expiration_time: 60   # posle 60 min neaktivnosti pocinje nova sesija (LLM vise ne vidi stari razgovor)
  carry_over_slots_to_new_session: true   # popunjeni slotovi se prenose u novu sesiju
version: "3.1"

actions:
  - action_search_events
  - action_resolve_event
  - action_get_event_availability
  - action_list_my_reservations
  - action_reserve_event
  - action_cancel_reservation

slots:
  # --- Filteri za pretragu događaja (opcioni, LLM ih popunjava iz poruke) ---
  # initial_value je bitan: collect korak se PRESKACE kad slot vec ima vrednost,
  # pa Rasa ne pita za filtere koje korisnik nije naveo. Prazan tekst / false = "bez filtera".
  search_term:
    type: text
    initial_value: ""
    mappings:
      - type: from_llm
  start_date:
    type: text
    initial_value: ""
    mappings:
      - type: from_llm
  end_date:
    type: text
    initial_value: ""
    mappings:
      - type: from_llm
  search_month:
    type: text
    initial_value: ""
    mappings:
      - type: from_llm
  search_year:
    type: text
    mappings:
      - type: from_llm
  location:
    type: text
    initial_value: ""
    mappings:
      - type: from_llm
  only_available:
    type: bool
    initial_value: false
    mappings:
      - type: from_llm

  # #primer sa validatorom, za proveru formata gresaka pri kucanju i slicno: 
  #  phone_number:
  #   type: text
  #   mappings:
  #     - type: from_llm
  #   validation:
  #     rejections:
  #       - if: not (slots.phone_number matches "^\([0-9]{3}\) [0-9]{3}-[0-9]{4}$")
  #         utter: utter_invalid_phone_number
  #     refill_utter: "utter_refill_phone_number"
  
  # --- Identifikatori nad kojima se izvršava akcija ---
  event_name:
    type: text
    mappings:
      - type: from_llm
  event_id:
    type: float
    mappings:
      - type: from_llm
  event_confirmed:
    type: bool
    mappings:
      - type: from_llm
  event_match:
    type: text
    mappings:
      - type: controlled
  last_listed_events:
    type: list
    mappings:
      - type: controlled

  reservation_id:
    type: float
    mappings:
      - type: from_llm
  notes:
    type: text
    mappings:
      - type: from_llm

  # --- Rezultati akcija, popunjava ih iskljucivo Python akcija (SlotSet),
  #     nikad LLM - odgovori ih samo prikazuju korisniku. ---
  events_search_result:
    type: text
    mappings:
      - type: controlled
  event_availability_result:
    type: text
    mappings:
      - type: controlled
  my_reservations_result:
    type: text
    mappings:
      - type: controlled
  reservation_action_result:
    type: text
    mappings:
      - type: controlled

responses:
  utter_ask_search_term:
    - text: "Шта бисте желели да пронађете? Реците назив, тему, или 'сви догађаји' ако желите комплетну листу."
      # Moguce ej dodati transaltion: i u ovo redu jezik i prevod na tom jeziku
  utter_ask_start_date:
    - text: "Од ког датума да тражим догађаје? (нпр. 2026-10-01, или реците да вам није битно)"

  utter_ask_end_date:
    - text: "До ког датума да тражим догађаје?"
  
  utter_ask_search_year:
    - text: "Нисте навели годину. За коју годину да тражим догађаје?"

  utter_ask_location:
    - text: "Да ли тражите догађаје у одређеном месту?"

  utter_ask_only_available:
    - text: "Да прикажем само догађаје који још увек имају слободних места?"

  utter_ask_event_name:
    - text: "За који догађај? Унесите назив догађаја."

  utter_ask_event_confirmed:
    - text: "Да ли сте сигурни да желите резервацију за догађај {event_name}?"

  utter_ask_notes:
    - text: "Желите ли да додате напомену уз резервацију? Ако не, реците 'не'."

  utter_ask_reservation_id:
    - text: "Коју резервацију желите да откажете? Реците ID резервације или назив догађаја."

  utter_search_events_result:
    - text: "{events_search_result}"

  utter_event_availability_result:
    - text: "{event_availability_result}"

  utter_my_reservations_result:
    - text: "{my_reservations_result}"

  utter_reservation_action_result:
    - text: "{reservation_action_result}"

  # Override za ugrađeni pattern_cannot_handle flow (grana "not_supported") -
  # ovo je tacan tekst koji je stari Foundry agent vracao za zahteve van
  # obima ove aplikacije.
  utter_cannot_handle:
    - text: "Није могуће извршити тражени захтев"

  # Koristi ga EnterpriseSearchPolicy kad u ./docs nema relevantnog odgovora (check_relevancy: true).
  utter_no_relevant_answer_found:
    - text: "Нажалост, немам информацију о томе. Могу да помогнем око претраге догађаја, доступности и резервација."

  # Override ugradjenog odgovora iz pattern_completed (original je engleski + rephrase,
  # pa je LLM birao pismo sam). Fiksan tekst, bez rephrase.
  utter_can_do_something_else:
    - text: "Да ли могу да Вам помогнем са још нечим?"

  # Override ugradjenog odgovora iz pattern_human_handoff (original je engleski).
  # Prebacivanje na zivog operatera jos ne postoji, pa samo obavestavamo korisnika.
  utter_human_handoff_not_available:
    - text: "Разумем да желите да разговарате са особом, али то тренутно није могуће. Могу да помогнем око претраге догађаја, доступности и резервација."

  utter_free_chitchat_response:
    - text: "placeholder"
      metadata:
        rephrase: True
        rephrase_prompt: |
          Sledi razgovor sa AI asistentom napravljenim u Rasa frejmvorku.
          Asistent pomaže korisnicima da pronađu događaje, provere dostupnost
          i upravljaju svojim rezervacijama za Event Reservation aplikaciju.
          Asistent je ljubazan, kratak i prijateljski nastrojen.
          Korisnik ćaska van teme - asistent treba da odgovori kratko i
          ljubazno, bez izmišljanja podataka o događajima ili rezervacijama.
          Asistent UVEK odgovara na srpskom jeziku, ISKLJUČIVO ćiriličnim pismom,
          čak i kada korisnik piše latinicom ili na drugom jeziku. Ne mešati pisma.
          Kontekst / prethodni razgovor sa korisnikom:
          {{history}}
          {{current_input}}
          Predloženi odgovor asistenta:

session_config:
  session_expiration_time: 60   # posle 60 min neaktivnosti pocinje nova sesija (LLM vise ne vidi stari razgovor)
  carry_over_slots_to_new_session: true   # popunjeni slotovi se prenose u novu sesiju
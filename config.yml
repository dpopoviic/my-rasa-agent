recipe: default.v1 #koja se verzija formata korsiti za parsiranje konfiguracije
language: sr #koji je jezik koji agent za nlu koristi
assistant_id: square-circuit # ID koji identifikuje agenta
pipeline: #kako se poruka korisnika obradjuje
  # Varijanta command generatora koja pored StartFlow/SetSlot... zna i komandu SearchAndReply
  # (pitanje za bazu znanja). Zamenjuje CompactLLMCommandGenerator, ne koriste se oba.
  - name: SearchReadyLLMCommandGenerator
    llm:
      model_group: azure_llm_deployments #id grupe modela koja se definise u endpoints.yml
    flow_retrieval:
      active: false #kad imate veliki broj flow-ova ovo se moze ukljuciti (tada treba i embeddings model_group)
policies: # koja logika bira sledecu akciju u razgovoru
  - name: FlowPolicy #izvrsava definisanu poslovnu logiku iz flows.yml korak po korak
  - name: EnterpriseSearchPolicy #odgovara na pitanja iz dokumenata u ./docs (izvrsava SearchAndReply komandu)
    vector_store:
      type: azure_search_store.AzureAISearch_Store #nasa klasa iz azure_search_store.py; parametri su u endpoints.yml (vector_store)
    llm:
      model_group: azure_llm_deployments #model koji pise odgovor iz pronadjenih delova dokumenata
    embeddings:
      model_group: azure_embeddings #embedding model - pretvara dokumente i pitanje u vektore
    check_relevancy: true #ako pronadjeni tekst ne odgovara pitanju, vraca utter_no_relevant_answer_found
